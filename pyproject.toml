[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mose"
version = "0.1.0"
description = "Configurable microlensing optimization and MCMC workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
native = ["VBMicrolensing>=5.5", "emcee>=3.1", "h5py>=3.9"]
jax = ["numpy<2", "jax==0.4.35", "numpyro==0.15.3", "VBMicrolensing==5.5", "pybind11>=2.10", "cmake>=3.18"]
test = ["pytest>=7"]

[project.scripts]
microevent = "microevent_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
