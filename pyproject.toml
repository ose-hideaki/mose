[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mose"
version = "0.1.0"
description = "Configurable microlensing optimization and MCMC workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
native = ["VBMicrolensing>=5.5", "emcee>=3.1", "h5py>=3.9"]
jax = ["numpy<2", "jax==0.6.2", "numpyro==0.19.0", "lcbinint @ git+https://github.com/NunotaKansuke/lcbinint.git@b51c00c566667fc2ed1fe640543219f480642002"]
test = ["pytest>=7"]

[project.scripts]
microevent = "microevent_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
