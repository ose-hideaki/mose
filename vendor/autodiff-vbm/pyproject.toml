[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodiff-vbm"
version = "0.1.0"
description = "Differentiable VBMicrolensing: the VBMicrolensing API, returning JAX values with analytic derivatives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kansuke Nunota" }]
keywords = ["microlensing", "gravitational-lensing", "jax", "automatic-differentiation", "astronomy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "jax>=0.4.31",
    "jaxlib>=0.4.31",
    "numpy>=1.24",
]

[project.optional-dependencies]
# The native contour FFI links VBMicrolensing 5.5's C++ sources.  The version is
# pinned because the integration uses VBM's internal contour data structures,
# not only its stable Python API.
vbm = ["VBMicrolensing==5.5", "pybind11>=2.10"]
test = ["pytest>=7", "scipy>=1.10"]

[project.scripts]
autodiff-vbm-build-native = "autodiff_vbm._native_build:main"

[project.urls]
Homepage = "https://github.com/NunotaKansuke/autodiff-vbm"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["fast: quick checks that do not need a deep-tolerance oracle"]
