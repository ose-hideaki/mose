name: tests
on: [push, pull_request]
jobs:
  native-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[native]'
      - run: python -m unittest discover -s tests -v
  jax-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libgsl-dev libboost-dev
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install 'numpy<2' 'jax==0.6.2' 'numpyro==0.19.0' scikit-build-core pybind11 cmake
      - run: python -m pip install --no-build-isolation -e '.[jax,native]'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
      - run: python -m unittest discover -s tests -v
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MPLBACKEND: Agg
