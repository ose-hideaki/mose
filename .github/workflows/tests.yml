name: tests
on: [push, pull_request]
jobs:
  native-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[native]'
      - run: python -m unittest discover -s tests -v
  jax-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[jax,native]'
      - run: python -m pip install --no-build-isolation --no-deps -e vendor/autodiff-vbm
      - run: autodiff-vbm-build-native
      - run: python -m unittest discover -s tests -v
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MPLBACKEND: Agg
